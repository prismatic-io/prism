query instance($id: ID!) {
  instance(id: $id) {
    configVariables {
      nodes {
        requiredConfigVariable {
          key
          connectionTemplate {
            inputFieldTemplates {
              nodes {
                inputField {
                  key
                }
                value
              }
            }
          }
        }
        inputs {
          nodes {
            name
            value
          }
        }
        meta
      }
    }
  }
}
