name: Build

on: [push]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.19.0", "22", "24", "26"]
    name: validate (node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.7
      - run: mise install node@${{ matrix.node-version }}
      - run: bun install --frozen-lockfile
      - run: mise exec node@${{ matrix.node-version }} -- npm install --dry-run --engine-strict
      - run: mise run validate
        env:
          MISE_NODE_VERSION: ${{ matrix.node-version }}

  test-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.2.7
      - run: mise exec -- bun install --frozen-lockfile
      - run: mise exec -- bun run clean-test-temp
      - run: mise exec -- bun run bundle
      - run: mise exec -- node node_modules/vitest/vitest.mjs run
