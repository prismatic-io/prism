[tools]
"github-cli" = "2.43.1"
bun = "1.3.12"
node = "24"

[tasks.build]
description = "Build the project"
run = "bun run build"

[tasks."format:check"]
description = "Check source file formatting"
run = "bun run check-format"

[tasks.lint]
description = "Lint the source code"
run = "bun run lint"

[tasks.test]
description = "Run tests"
run = "bun run test"

[tasks."test:node22"]
description = "Run tests against Node 22"
run = "MISE_NODE_VERSION=22 mise run test"

[tasks.validate]
description = "Run all validation checks"
run = ["bun run check-format", "bun run lint", "bun run build", "bun run test"]

[tasks."validate:node22"]
description = "Run all validation checks against Node 22"
run = "MISE_NODE_VERSION=22 mise run validate"

[tasks."validate:node24"]
description = "Run all validation checks against Node 24"
run = "MISE_NODE_VERSION=24 mise run validate"

[tasks."validate:node26"]
description = "Run all validation checks against Node 26"
run = "MISE_NODE_VERSION=26 mise run validate"

[tasks.version-bump]
description = "Bump package.json version (set BUMP_TYPE=patch|minor|major|preview)"
run = """
if [ "$BUMP_TYPE" = "preview" ]; then
  CURRENT_VERSION=$(node -p "require('./package.json').version")
  case "$CURRENT_VERSION" in
    *-preview.*)
      BASE_VERSION=${CURRENT_VERSION%%-preview.*}
      PREVIEW_NUMBER=${CURRENT_VERSION#*-preview.}
      # Recover versions with a duplicate preview suffix from the old bump task.
      PREVIEW_NUMBER=${PREVIEW_NUMBER%%-preview.*}
      case "$PREVIEW_NUMBER" in
        ''|*[!0-9]*) echo "Invalid preview version: $CURRENT_VERSION" >&2; exit 1 ;;
      esac
      npm version "$BASE_VERSION-preview.$((PREVIEW_NUMBER + 1))" --no-git-tag-version
      ;;
    *) npm version "$CURRENT_VERSION-preview.0" --no-git-tag-version ;;
  esac
else
  npm version "$BUMP_TYPE" --no-git-tag-version
fi
"""

[tasks.release]
description = "Trigger a release (usage: mise run release -- patch|minor|major|preview)"
usage = '''
arg "<bump>" help="Version bump type" {
  choices "patch" "minor" "major" "preview"
}
'''
run = """
gh workflow run release.yml -f bump="$usage_bump"
echo "Release workflow triggered with bump=$usage_bump"
"""

[tasks."release:preview11"]
description = "Temporary task: release a Prism 11 preview from next to npm's preview-11 tag"
run = """
gh workflow run release.yml --ref next -f bump=preview
echo "Prism 11 preview release workflow triggered from next"
"""
